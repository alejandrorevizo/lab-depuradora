<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Laboratorio depuradora · Revizo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script>
    // Tema guardado antes de pintar, para evitar parpadeo.
    try { const t = localStorage.getItem('revizo-lab-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img class="brand-logo light" src="/logo-revizo-crop.jpg" alt="Revizo · Instalaciones y mantenimiento" width="385" height="144" />
      <img class="brand-logo dark" src="/logo-revizo-dark-crop.png" alt="Revizo · Instalaciones y mantenimiento" width="385" height="144" />
      <span class="brand-sep" aria-hidden="true"></span>
      <div class="brand-title">
        <h1>Laboratorio depuradora</h1>
        <span class="src" id="source-label">Sin datos cargados</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn primary" id="btn-upload" title="Subir un Excel nuevo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
        <span class="lbl">Subir Excel</span>
      </button>
      <button class="btn ghost icon" id="btn-history" title="Versiones anteriores del Excel" aria-label="Versiones anteriores">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
      </button>
      <button class="btn ghost icon" id="btn-bookmarks" title="Vistas guardadas" aria-label="Vistas guardadas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button class="btn ghost icon" id="btn-export" title="Exportar datos filtrados (CSV)" aria-label="Exportar CSV">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg>
      </button>
      <button class="btn ghost icon" id="btn-theme" title="Modo claro / oscuro" aria-label="Cambiar tema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="btn ghost icon present-keep" id="btn-present" title="Modo presentación" aria-label="Modo presentación">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="btn ghost icon" id="btn-logout" title="Cerrar sesión" aria-label="Cerrar sesión">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <div class="filterbar hidden" id="filterbar"></div>
  <nav class="tabs hidden" id="tabs" role="tablist" aria-label="Páginas del dashboard"></nav>
  <main id="main">
    <div class="empty"><div class="spinner"></div><p class="muted">Cargando datos…</p></div>
  </main>

  <input type="file" id="file-input" accept=".xlsx,.xlsm,.xls" hidden />
  <div class="drop-overlay" aria-hidden="true">Suelta el Excel para cargarlo</div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <aside class="drawer" id="drawer" aria-label="Detalle del día"></aside>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
