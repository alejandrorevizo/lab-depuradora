<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Acceso · Laboratorio depuradora</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; --page:#f4f5f7; --surface:#fff; --ink:#111827; --ink3:#6b7280; --border:rgba(17,24,39,.16); --navy:#1c2e46; --teal:#6cb3ac; --err:#b42323; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --page:#0f141b; --surface:#171d26; --ink:#f3f5f8; --ink3:#9aa3b1; --border:rgba(255,255,255,.16); --err:#ff8a8a; } }
    :root[data-theme="dark"] { color-scheme: dark; --page:#0f141b; --surface:#171d26; --ink:#f3f5f8; --ink3:#9aa3b1; --border:rgba(255,255,255,.16); --err:#ff8a8a; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:16px; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: min(400px, 100%); background: var(--surface); border:1px solid var(--border); border-radius: 16px; padding: 28px; box-shadow: 0 16px 40px rgba(28,46,70,.14); }
    .logo { display:block; height: 56px; width:auto; margin: 0 0 18px; }
    .logo.d { display:none; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo.l { display:none; } :root:not([data-theme="light"]) .logo.d { display:block; } }
    :root[data-theme="dark"] .logo.l { display:none; } :root[data-theme="dark"] .logo.d { display:block; }
    h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
    p { margin: 0 0 20px; color: var(--ink3); font-size: 14px; }
    label { display:block; font-size: 13px; font-weight: 650; margin: 0 0 6px; }
    input { width:100%; height: 44px; border-radius: 10px; border: 1px solid var(--border); background: transparent; padding: 0 12px; font: inherit; color: inherit; margin-bottom: 14px; }
    input:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
    button { width:100%; height: 44px; border:0; border-radius: 10px; background: var(--navy); color:#fff; font: inherit; font-weight: 650; cursor:pointer; }
    button:disabled { opacity:.6; }
    .err { color: var(--err); font-size: 13px; min-height: 20px; margin: 10px 0 0; }
    .hidden { display:none; }
  </style>
  <script>try { const t = localStorage.getItem('revizo-lab-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <main>
    <img class="logo l" src="/logo-revizo-crop.jpg" alt="Revizo · Instalaciones y mantenimiento" width="385" height="144">
    <img class="logo d" src="/logo-revizo-dark-crop.png" alt="Revizo · Instalaciones y mantenimiento" width="385" height="144">
    <h1>Laboratorio depuradora</h1>
    <p>Introduce la contraseña de acceso.</p>
    <form id="f" novalidate>
      <div id="user-row" class="hidden">
        <label for="user">Usuario</label>
        <input id="user" name="user" autocomplete="username">
      </div>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="go" type="submit">Entrar</button>
      <div class="err" id="err" role="alert"></div>
    </form>
  </main>
  <script>
    const $ = (s) => document.querySelector(s);
    fetch('/api/login', { cache: 'no-store' }).then((r) => r.json()).then((j) => {
      if (j.users) { $('#user-row').classList.remove('hidden'); document.querySelector('p').textContent = 'Introduce tu usuario y contraseña.'; $('#user').focus(); }
      if (!j.configured) $('#err').textContent = 'El acceso todavía no está configurado en Vercel (DASHBOARD_PASSWORD).';
    }).catch(() => {});
    $('#f').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('#go').disabled = true; $('#err').textContent = '';
      try {
        const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ user: $('#user').value, password: $('#password').value }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || 'No se pudo entrar.');
        const next = new URLSearchParams(location.search).get('next') || '/';
        location.href = /^\/(?!\/)/.test(next) ? next : '/';
      } catch (err) {
        $('#err').textContent = err.message;
        $('#go').disabled = false;
        $('#password').select();
      }
    });
  </script>
</body>
</html>
